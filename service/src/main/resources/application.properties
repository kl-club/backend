spring.application.name=service

# MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kl_club?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=newuser
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false

# Exibir os grupos em ordem alfabética
springdoc.swagger-ui.tagsSorter=alpha

# Organizar as operações por método HTTP
springdoc.swagger-ui.operationsSorter=method

# Iniciar todas as seções recolhidas
springdoc.swagger-ui.docExpansion=none

# Habilitar pesquisa de endpoints
springdoc.swagger-ui.filter=true

# Exibir a duração das requisições
springdoc.swagger-ui.displayRequestDuration=true

# Exibir exemplos JSON por padrão
springdoc.swagger-ui.defaultModelRendering=example

